name: Production Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: perfect-156b5.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://perfect-156b5-default-rtdb.firebaseio.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: perfect-156b5
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: perfect-156b5.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 435536634816
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:435536634816:web:2f480f6d627e032da1de25
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-H9WJWPEY59
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
